# PostgreSQL Cluster Configuration using CloudNativePG (CNPG)
# This creates a highly available PostgreSQL cluster with 3 instances
# CNPG provides automated failover, backup, and recovery capabilities
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: my-postgres
  namespace: default
spec:
  # Number of PostgreSQL instances (pods) in the cluster
  instances: 3
  # Storage configuration for persistent data
  storage:
    size: 1Gi
  # Bootstrap configuration for initial database setup
  bootstrap:
    initdb:
      # Initial database name
      database: todo_db
      # Database owner (superuser)
      owner: todo_user
      # Reference to the secret containing database credentials
      secret:
        name: db-secret

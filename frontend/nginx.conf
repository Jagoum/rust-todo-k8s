# Nginx Configuration for Todo App Frontend
#
# Serves the React application static files and proxies API requests to the backend.
# Configured for production deployment with optimizations and proper routing.

server {
    # Listen on port 80 (HTTP)
    listen 80;
    server_name localhost;
    
    # Document root containing built React application
    root /usr/share/nginx/html;
    index index.html;

    # Handle client-side routing for React Router
    # All non-API requests fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend service
    # Removes /api prefix and forwards to backend container
    location /api/ {
        # Backend service URL (Docker Compose service name)
        proxy_pass http://backend:8080/;
        
        # Preserve original request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Optional: Add timeout settings for backend requests
        # proxy_connect_timeout 30s;
        # proxy_send_timeout 30s;
        # proxy_read_timeout 30s;
    }

    # Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/xml+rss 
        application/json;
    
    # Optional: Security headers
    # add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header X-XSS-Protection "1; mode=block" always;
    
    # Optional: Cache static assets
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
}
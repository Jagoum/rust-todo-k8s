# Database Secret for Rust Backend Application
# This secret contains the credentials and connection string for the PostgreSQL database
# Used by the Rust backend to connect to the CNPG-managed PostgreSQL cluster
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: default
type: kubernetes.io/basic-auth
stringData:
  username: todo_user
  password: todo_password
  DATABASE_URL: postgres://todo_user:todo_password@my-postgres-rw:5432/todo_db

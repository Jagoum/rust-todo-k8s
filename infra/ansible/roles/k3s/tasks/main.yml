---
- name: Kill any running apt processes
  shell: pkill -f apt-get || true
  ignore_errors: true

- name: Wait for apt lock to be released
  pause:
    seconds: 5

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install baseline packages
  apt:
    name:
      - build-essential
      - pkg-config
      - libssl-dev
      - cmake
      - clang
      - curl
      - git
      - unzip
      - jq
      - make
      - ca-certificates
      - apt-transport-https
      - gnupg
      - software-properties-common
      - net-tools
      - htop
      - tmux
      - vim
      - python3
      - python3-pip
    state: present

- name: Add Docker's official GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Install Docker and docker-compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Install docker-compose v1 (standalone)
  get_url:
    url: https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64
    dest: /usr/local/bin/docker-compose
    mode: '0755'

- name: Start and enable Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group
  user:
    name: "{{ ansible_user | default('ubuntu') }}"
    groups: docker
    append: yes

- name: Disable swap
  command: swapoff -a
  when: (ansible_swaptotal_mb | default(0) | int) > 0
  changed_when: true

- name: Comment out swap entries in /etc/fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s)'
    replace: '# \1'
  ignore_errors: true

- name: Ensure br_netfilter module is loaded
  modprobe:
    name: br_netfilter
    state: present

- name: Configure sysctl for Kubernetes networking
  copy:
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
    dest: /etc/sysctl.d/k8s.conf
    mode: '0644'

- name: Apply sysctl parameters
  command: sysctl --system
  changed_when: true

- name: Install k3s server on controller
  shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644 --bind-address 0.0.0.0 --advertise-address {{ ansible_host | default(ansible_default_ipv4.address) }} --tls-san {{ ansible_host | default(ansible_default_ipv4.address) }}" sh -
  args:
    creates: /etc/systemd/system/k3s.service
  when: "'controller' in group_names"

- name: Wait for k3s API on controller (mTLS)
  uri:
    url: "https://{{ ansible_host | default(ansible_default_ipv4.address) }}:6443/readyz"
    method: GET
    status_code: 200
    client_cert: /var/lib/rancher/k3s/server/tls/client-admin.crt
    client_key: /var/lib/rancher/k3s/server/tls/client-admin.key
    ca_path: /var/lib/rancher/k3s/server/tls/server-ca.crt
  register: api_ok
  until: api_ok.status == 200
  retries: 30
  delay: 5
  when: "'controller' in group_names"

- name: Read k3s node token on controller
  command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  changed_when: false
  delegate_to: "{{ groups['controller'][0] }}"
  run_once: true


- name: Install k3s agent on workers
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL="https://{{ hostvars[groups['controller'][0]].ansible_host | default(hostvars[groups['controller'][0]].ansible_default_ipv4.address) }}:6443" K3S_TOKEN="{{ k3s_token.stdout }}" sh -
  args:
    creates: /etc/systemd/system/k3s-agent.service
  when: "'workers' in group_names"

- name: Create .kube directory for controller user
  file:
    path: "/home/{{ ansible_user | default('ubuntu') }}/.kube"
    state: directory
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: '0755'
  when: "'controller' in group_names"

- name: Copy k3s kubeconfig to controller user's home
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ ansible_user | default('ubuntu') }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: '0644'
  when: "'controller' in group_names"

- name: Update kubeconfig server to use controller IP
  replace:
    path: "/home/{{ ansible_user | default('ubuntu') }}/.kube/config"
    regexp: 'server: https://127\.0\.0\.1:6443'
    replace: "server: https://{{ ansible_host | default(ansible_default_ipv4.address) }}:6443"
  when: "'controller' in group_names"


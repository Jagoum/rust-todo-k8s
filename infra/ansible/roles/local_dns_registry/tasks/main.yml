---
# Role: local_dns_registry
# - Configure local DNS on all nodes by updating /etc/hosts
# - On controller: install nerdctl, run a local registry on :5000, configure k3s mirrors,
#   and mirror required images (Keycloak, CNPG, Linkerd) into the local registry.

- name: Determine controller IP
  set_fact:
    controller_ip: "{{ hostvars[groups['controller'][0]].ansible_host | default(hostvars[groups['controller'][0]].ansible_default_ipv4.address) }}"

- name: Ensure /etc/hosts entries for all inventory hosts
  lineinfile:
    path: /etc/hosts
    create: yes
    state: present
    line: "{{ hostvars[item].ansible_host | default(hostvars[item].ansible_default_ipv4.address) }} {{ item }}"
    regexp: "^{{ (hostvars[item].ansible_host | default(hostvars[item].ansible_default_ipv4.address)) | regex_escape }}\\s+{{ item | regex_escape }}$"
  loop: "{{ groups['all'] }}"

- name: Add registry.local alias to controller IP
  lineinfile:
    path: /etc/hosts
    create: yes
    state: present
    line: "{{ controller_ip }} registry.local"
    regexp: "^{{ controller_ip | regex_escape }}\\s+registry\\.local$"

# Controller-only tasks below
- name: Check for nerdctl
  command: nerdctl --version
  register: nerdctl_check
  failed_when: false
  changed_when: false
  when: "inventory_hostname == groups['controller'][0]"

- name: Install nerdctl via apt if available
  apt:
    name: nerdctl
    state: present
    update_cache: yes
  when:
    - "inventory_hostname == groups['controller'][0]"
    - nerdctl_check.rc != 0
  ignore_errors: true

- name: Re-check nerdctl after apt install
  command: nerdctl --version
  register: nerdctl_check_after_apt
  failed_when: false
  changed_when: false
  when: "inventory_hostname == groups['controller'][0]"

- name: Ensure containerd is installed on controller
  apt:
    name: containerd
    state: present
    update_cache: yes
  when: "inventory_hostname == groups['controller'][0]"

- name: Download nerdctl binary if still missing
  block:
    - name: Query latest nerdctl release
      uri:
        url: https://api.github.com/repos/containerd/nerdctl/releases/latest
        method: GET
        status_code: 200
      register: nerdctl_release

    - name: Set nerdctl version facts
      set_fact:
        nerdctl_version: "{{ nerdctl_release.json.tag_name }}"
        nerdctl_ver_nov: "{{ nerdctl_release.json.tag_name | regex_replace('^v','') }}"
        nerdctl_arch: "{{ 'amd64' if ansible_architecture in ['x86_64'] else 'arm64' if ansible_architecture in ['aarch64','arm64'] else 'amd64' }}"

    - name: Download nerdctl tarball
      get_url:
        url: "https://github.com/containerd/nerdctl/releases/download/{{ nerdctl_version }}/nerdctl-{{ nerdctl_ver_nov }}-linux-{{ nerdctl_arch }}.tar.gz"
        dest: /tmp/nerdctl.tgz
        mode: '0644'

    - name: Install nerdctl binary
      unarchive:
        src: /tmp/nerdctl.tgz
        dest: /usr/local/bin/
        remote_src: true
  when:
    - "inventory_hostname == groups['controller'][0]"
    - (nerdctl_check.rc | default(1)) != 0 and (nerdctl_check_after_apt.rc | default(1)) != 0

- name: Pull registry:2 image using nerdctl (controller)
  shell: |
    nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io pull registry:2
  args:
    executable: /bin/bash
  when: "inventory_hostname == groups['controller'][0]"

- name: Check if local-registry container exists (controller)
  shell: |
    nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io inspect local-registry >/dev/null 2>&1
  register: registry_exists
  failed_when: false
  changed_when: false
  when: "inventory_hostname == groups['controller'][0]"

- name: Get local-registry container state (controller)
  shell: |
    nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io inspect -f '{{.State.Status}}' local-registry
  register: registry_state
  failed_when: false
  changed_when: false
  when:
    - "inventory_hostname == groups['controller'][0]"
    - registry_exists.rc == 0

- name: Remove non-running local-registry container (controller)
  shell: |
    nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io rm -f local-registry
  args:
    executable: /bin/bash
  when:
    - "inventory_hostname == groups['controller'][0]"
    - registry_exists.rc == 0
    - (registry_state.stdout | default('')) != 'running'

- name: Run local registry on port 5000 (controller)
  shell: |
    nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io run -d \
      --name local-registry \
      --net host \
      --restart always \
      -e REGISTRY_HTTP_ADDR=0.0.0.0:5000 \
      registry:2
  args:
    executable: /bin/bash
  when:
    - "inventory_hostname == groups['controller'][0]"
    - registry_exists.rc != 0 or (registry_state.stdout | default('')) != 'running'

- name: Ensure local registry is started (controller)
  shell: |
    nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io start local-registry
  args:
    executable: /bin/bash
  register: registry_started
  failed_when: false
  changed_when: "'Started' in (registry_started.stdout | default(''))"
  when: "inventory_hostname == groups['controller'][0]"

- name: Wait for local registry TCP port to open
  wait_for:
    host: "{{ controller_ip }}"
    port: 5000
    state: started
    timeout: 120
  when: "inventory_hostname == groups['controller'][0]"

- name: Wait for local registry HTTP endpoint
  uri:
    url: "http://{{ controller_ip }}:5000/v2/"
    method: GET
    status_code: 200
  register: registry_http
  until: registry_http.status == 200
  retries: 30
  delay: 2
  when: "inventory_hostname == groups['controller'][0]"

- name: Ensure k3s registries config directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Configure k3s to trust local registry and use HTTP endpoint
  copy:
    dest: /etc/rancher/k3s/registries.yaml
    mode: '0644'
    content: |
      configs:
        "{{ controller_ip }}:5000":
          tls:
            insecure_skip_verify: true
      mirrors:
        "{{ controller_ip }}:5000":
          endpoint:
            - "http://{{ controller_ip }}:5000"

- name: Restart k3s on controller to apply registries config
  service:
    name: k3s
    state: restarted
  when: "'controller' in group_names"

- name: Restart k3s-agent on workers to apply registries config
  service:
    name: k3s-agent
    state: restarted
  when: "'workers' in group_names"

# Define default images if not provided externally
- name: Set default versions for images (base)
  set_fact:
    keycloak_version: "{{ keycloak_version | default('24.0.5') }}"
    cnpg_version: "{{ cnpg_version | default('1.23.0') }}"
    linkerd_controlplane_version: "{{ linkerd_controlplane_version | default('stable-2.14.5') }}"
    linkerd_proxy_init_version: "{{ linkerd_proxy_init_version | default('v2.4.3') }}"
    linkerd_cni_plugin_version: "{{ linkerd_cni_plugin_version | default('v1.6.4') }}"

- name: Set default for linkerd_proxy_version to control plane version
  set_fact:
    linkerd_proxy_version: "{{ linkerd_proxy_version | default(linkerd_controlplane_version) }}"


- name: Build default image list if images_to_mirror is undefined
  set_fact:
    images_to_mirror: "{{ images_to_mirror | default([
      'quay.io/keycloak/keycloak:' ~ keycloak_version,
      'ghcr.io/cloudnative-pg/cloudnative-pg:' ~ cnpg_version,
      'ghcr.io/linkerd/controller:' ~ linkerd_controlplane_version,
      'ghcr.io/linkerd/proxy:' ~ linkerd_proxy_version,
      'ghcr.io/linkerd/proxy-init:' ~ linkerd_proxy_init_version,
      'ghcr.io/linkerd/cni-plugin:' ~ linkerd_cni_plugin_version
    ]) }}"

- name: Pull images to controller cache
  shell: |
    nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io pull {{ item }}
  args:
    executable: /bin/bash
  loop: "{{ images_to_mirror }}"
  when: "inventory_hostname == groups['controller'][0]"

- name: Tag images to local registry namespace
  shell: |
    nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io tag {{ item }} {{ controller_ip }}:5000/{{ item | regex_replace('^([^/]+)/', '') }}
  args:
    executable: /bin/bash
  loop: "{{ images_to_mirror }}"
  when: "inventory_hostname == groups['controller'][0]"

- name: Push images to local registry (plain HTTP)
  shell: |
    nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io --insecure-registry push {{ controller_ip }}:5000/{{ item | regex_replace('^([^/]+)/', '') }}
  args:
    executable: /bin/bash
  loop: "{{ images_to_mirror }}"
  when: "inventory_hostname == groups['controller'][0]"

# For development/testing - create a self-signed certificate
# In production, replace with proper certificates from a trusted CA

# First, generate a self-signed certificate (run these commands locally):
# openssl req -x509 -newkey rsa:4096 -keyout tls.key -out tls.crt -days 365 -nodes -subj "/CN=keycloak.local"
# kubectl create secret tls keycloak-tls --cert=tls.crt --key=tls.key

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-tls
  namespace: default
type: kubernetes.io/tls
data:
  # Placeholder - replace with actual base64-encoded certificate data
  # To generate: openssl req -x509 -newkey rsa:4096 -keyout tls.key -out tls.crt -days 365 -nodes -subj "/CN=keycloak.local"
  # Then: cat tls.crt | base64 -w 0
  tls.crt: ""
  # Then: cat tls.key | base64 -w 0
  tls.key: ""

# Keycloak Database Secret
# This secret contains the database connection details for Keycloak
# Keycloak uses these credentials to connect to the PostgreSQL database
# The database is managed by the CNPG operator
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: default
type: Opaque
stringData:
  # Database username for Keycloak
  KC_DB_USERNAME: todo_user
  # Database password for Keycloak
  KC_DB_PASSWORD: todo_password
  # JDBC connection URL pointing to the PostgreSQL cluster
  # my-postgres-rw is the read-write service created by CNPG
  KC_DB_URL: jdbc:postgresql://my-postgres-rw:5432/todo_db

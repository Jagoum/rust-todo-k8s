apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: 192.168.82.102:5000/keycloak/keycloak:24.0.5
        args: ["start"]
        ports:
        - containerPort: 8443
        envFrom:
        - secretRef:
            name: keycloak-db-secret
        - configMapRef:
            name: keycloak-config
        env:
        - name: KC_HOSTNAME
          value: "keycloak.local"
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        - name: KC_HTTPS_PORT
          value: "8443"
        - name: KC_HTTP_SECURITY_HEADERS_CSP_FRAME_SRC
          value: "'self' http://todo.local http://api.todo.local https://keycloak.local http://keycloak.local"
        - name: KC_HTTP_SECURITY_HEADERS_CSP_FRAME_ANCESTORS
          value: "'self' http://todo.local http://api.todo.local https://keycloak.local http://keycloak.local"
        - name: KC_HTTP_SECURITY_HEADERS_CSP_REPORT_ONLY
          value: "true"
        volumeMounts:
        - mountPath: /opt/keycloak/data
          name: keycloak-data
        - mountPath: /opt/keycloak/conf
          name: keycloak-tls
          readOnly: true
      volumes:
      - name: keycloak-data
        persistentVolumeClaim:
          claimName: keycloak-pvc
      - name: keycloak-tls
        secret:
          secretName: keycloak-tls
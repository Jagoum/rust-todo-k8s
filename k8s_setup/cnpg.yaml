---
# Secret for Rust backend (already exists in your setup, shown for completeness)
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: kubernetes.io/basic-auth
stringData:
  username: todo_user
  password: todo_password
  DATABASE_URL: postgres://todo_user:todo_password@my-postgres-rw:5432/todo_db

---
# PostgreSQL Cluster (CNPG)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: my-postgres
spec:
  instances: 3
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: todo_db
      owner: todo_user
      secret:
        name: db-secret
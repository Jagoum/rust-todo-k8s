apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-todo-ui
  namespace: default
  labels:
    app: react-todo-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-todo-ui
  template:
    metadata:
      labels:
        app: react-todo-ui
    spec:
      containers:
        - name: react-todo-ui
          image: "192.168.82.102:5000/todo-app-frontend:latest"
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_BACKEND_SERVER_URL
              value: "http://api.todo.local"
            - name: REACT_APP_KEYCLOAK_URL
              value: "https://keycloak.local"
            - name: REACT_APP_KEYCLOAK_REALM
              value: "master"
            - name: REACT_APP_KEYCLOAK_CLIENT_ID
              value: "todo-app"

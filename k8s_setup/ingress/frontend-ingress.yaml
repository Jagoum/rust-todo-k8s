# Ingress Configuration for React Frontend
# This ingress routes external traffic to the React frontend application
# Host: todo.local will serve the React UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-todo-ui-ingress
  namespace: default
  annotations:
    # Specify Traefik as the ingress controller
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    # Domain name for the frontend application
    - host: todo.local
      http:
        paths:
          # Route all paths to the React frontend service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-todo-ui-service
                port:
                  number: 3000

[package]
name = "todo-app"
version = "0.1.0"
authors = ["Jagoum Richemond <jagoum24@gmail.com>"]
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# SQLx with Postgres, runtime tokio + rustls TLS, and migrations
sqlx = { version = "0.7", default-features = false, features = [
  "postgres", "runtime-tokio-rustls", "uuid", "time", "migrate"
] }

uuid = { version = "1", features = ["serde", "v4"] }
time = { version = "0.3", features = ["macros", "serde", "parsing", "formatting"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"

# Auth
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
jsonwebtoken = { version = "9.3.1", default-features = false }
headers = "0.4"
http = "0.2"

[profile.release]
lto = true
codegen-units = 1

